name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  quality:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Domain tests
        run: dart test
        working-directory: packages/learnward_domain

      - name: Application tests
        run: dart test
        working-directory: packages/learnward_application

      - name: Data tests
        run: dart test
        working-directory: packages/learnward_data

      - name: Test support tests
        run: dart test
        working-directory: packages/learnward_test_support

      - name: Design system tests
        run: flutter test
        working-directory: packages/learnward_design_system

      - name: Flutter widget tests
        run: flutter test
        working-directory: apps/mobile

      - name: Verify generated Drift code is current
        run: |
          cd packages/learnward_data
          dart run build_runner build
          cd ../..
          git diff --exit-code -- packages/learnward_data/lib

  database:
    name: Supabase migrations & RLS security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.122.0"

      - name: Start Supabase local stack
        run: supabase start

      - name: Verify migrations
        run: supabase db reset

      - name: Run database and RLS pgTAP tests
        run: supabase test db

      - name: Run last-owner concurrency regression test
        run: node scripts/test_last_owner_concurrency.mjs

      - name: Run assessment verification concurrency regression test
        run: node scripts/test_assessment_verification_concurrency.mjs

      - name: Run assessment evidence storage security test
        run: node scripts/test_storage_evidence_security.mjs

      - name: Run assessment vertical slice and retry regression test
        run: node scripts/test_assessment_vertical_slice_retry.mjs

      - name: Run Growth Engine and ledger concurrency regression test
        run: node scripts/test_growth_concurrency.mjs

      - name: Run Growth Engine vertical slice integration test
        run: node scripts/test_growth_vertical_slice.mjs

      - name: Run Growth delivery recovery integration test
        run: node scripts/test_growth_delivery_recovery.mjs

      - name: Run Growth Engine Dart/Postgres parity test
        run: node scripts/test_growth_parity.mjs

      - name: Run Reward Store concurrency regression test
        run: node scripts/test_reward_store_concurrency.mjs

      - name: Run Reward Store vertical slice integration test
        run: node scripts/test_reward_store_vertical_slice.mjs

      - name: Run Celebration Wheel concurrency regression test
        run: node scripts/test_reward_wheel_concurrency.mjs

      - name: Run Celebration Wheel vertical slice integration test
        run: node scripts/test_reward_wheel_vertical_slice.mjs

      - name: Run Celebration Wheel timezone boundary test
        run: node scripts/test_reward_wheel_timezone.mjs

      - name: Run Learning Mastery concurrency regression test
        run: node scripts/test_learning_concurrency.mjs

      - name: Run Phase 5.2 Skill Graph & Next Challenge Dart/Postgres 61-case parity test
        run: node scripts/test_learning_recommendation_parity.mjs

      - name: Run Phase 5.2 Skill Graph & Next Challenge vertical slice integration test
        run: node scripts/test_learning_recommendation_vertical_slice.mjs

      - name: Run Learning Mastery vertical slice integration test
        run: node scripts/test_learning_vertical_slice.mjs

      - name: Run Learning Mastery Dart/Postgres parity test
        run: node scripts/test_learning_parity.mjs

      - name: Run Child Archival concurrency & mutation barrier regression test
        run: node scripts/test_child_archive_concurrency.mjs

  android:
    name: Android debug build
    needs: [quality, database]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Configure Gradle mirrors and pre-fetch distribution
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/01-maven-mirror.init.gradle
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository && (repo.url.toString().contains("maven.apache.org") || repo.url.toString().contains("repo1.maven.org") || repo.url.toString().contains("repo.maven.org"))) {
                      repo.url = uri("https://maven.aliyun.com/repository/public")
                  }
              }
              settings.dependencyResolutionManagement.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository && (repo.url.toString().contains("maven.apache.org") || repo.url.toString().contains("repo1.maven.org") || repo.url.toString().contains("repo.maven.org"))) {
                      repo.url = uri("https://maven.aliyun.com/repository/public")
                  }
              }
          }
          gradle.allprojects { project ->
              project.buildscript.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository && (repo.url.toString().contains("maven.apache.org") || repo.url.toString().contains("repo1.maven.org") || repo.url.toString().contains("repo.maven.org"))) {
                      repo.url = uri("https://maven.aliyun.com/repository/public")
                  }
              }
              project.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository && (repo.url.toString().contains("maven.apache.org") || repo.url.toString().contains("repo1.maven.org") || repo.url.toString().contains("repo.maven.org"))) {
                      repo.url = uri("https://maven.aliyun.com/repository/public")
                  }
              }
          }
          EOF
          WRAPPER_DIR="$HOME/.gradle/wrapper/dists/gradle-9.3.1-all/9ot9r568e8zfvvd4mn8rbu1j0"
          if [ ! -f "$WRAPPER_DIR/gradle-9.3.1-all.zip.ok" ]; then
            echo "Pre-fetching Gradle 9.3.1 distribution..."
            mkdir -p "$WRAPPER_DIR"
            ZIP_PATH="$WRAPPER_DIR/gradle-9.3.1-all.zip"
            if ! curl -fSL --retry 3 --retry-delay 2 "https://services.gradle.org/distributions/gradle-9.3.1-all.zip" -o "$ZIP_PATH"; then
              echo "Primary distribution URL timed out, falling back to mirror..."
              curl -fSL --retry 3 --retry-delay 2 "https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-all.zip" -o "$ZIP_PATH"
            fi
            unzip -q -o "$ZIP_PATH" -d "$WRAPPER_DIR"
            touch "$WRAPPER_DIR/gradle-9.3.1-all.zip.ok"
            touch "$WRAPPER_DIR/gradle-9.3.1-all.zip.lck"
          fi

      - name: Build debug APK
        run: flutter build apk --debug
        working-directory: apps/mobile

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: learnward-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS simulator compile
    needs: [quality, database]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      # Simulator builds need no signing credentials and protect normal PR CI
      # from App Store signing requirements.
      - name: Build for iOS simulator
        run: flutter build ios --simulator --debug
        working-directory: apps/mobile
