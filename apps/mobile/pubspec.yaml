environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  crypto: ^3.0.6
  drift: ^2.24.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
